stages: [test, build, release]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Downloadable binaries live in the generic package registry under this name.
  PKG: quip-miner-metal

cache:
  key: cargo-$CI_COMMIT_REF_SLUG
  paths: [.cargo/, target/]

# Shared macOS runner setup. This crate depends on Metal and IOKit and does not
# build on any other platform (`compile_error!` in `src/lib.rs`), so there is no
# Linux job to fall back on — every stage that touches Rust runs here.
#
# Targets the group's own Apple Silicon runners (`cray`, `tesla-arm`). These are
# shell executors with a real GPU, so no `image:` applies.
.macos:
  tags: [macos, arm64]
  before_script:
    # `--no-modify-path` keeps rustup-init from appending `source $CARGO_HOME/env`
    # to the runner's shell profile. `CARGO_HOME` is inside the build directory,
    # so that line breaks every later login shell once the job is cleaned up.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --no-modify-path
    - source "$CARGO_HOME/env"
    - brew install protobuf

# Lint, format and the full test suite, including the tests that need a real
# GPU. The runner is a Mac with Metal, so nothing is skipped.
test:
  extends: .macos
  stage: test
  script:
    - rustup component add clippy rustfmt
    - cargo fmt --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test

.build:
  stage: build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Binaries are cut for tagged releases only; branch and MR pipelines stop at
# the `test` stage.
build-macos-arm64:
  extends: [.build, .macos]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cargo build --release --bins
    - mkdir -p dist
    - cp target/release/quip-metal-sa dist/quip-metal-sa-darwin-arm64
    - cp target/release/quip-metal-gibbs dist/quip-metal-gibbs-darwin-arm64

# On a tag: upload the built binaries to the generic package registry, then cut
# a Release linking them as downloadable assets. `build-macos-arm64` is not
# optional, so a missing `dist/` means that job failed — fail loudly here rather
# than quietly publishing a release with no binaries.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - |
      if ! ls dist/* >/dev/null 2>&1; then
        echo "no binaries in dist/ — build-macos-arm64 did not produce artifacts" >&2
        exit 1
      fi
      for f in dist/*; do
        n=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}/${n}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [upload]
  before_script: []
  script:
    - |
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}"
      release-cli create --name "quip-miner-metal ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"quip-metal-sa-darwin-arm64\",\"url\":\"${base}/quip-metal-sa-darwin-arm64\"}" \
        --assets-link "{\"name\":\"quip-metal-gibbs-darwin-arm64\",\"url\":\"${base}/quip-metal-gibbs-darwin-arm64\"}"
