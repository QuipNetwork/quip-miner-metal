[package]
name = "quip-miner-metal"
version = "0.3.0"
edition = "2021"
description = "Metal Ising miners: simulated annealing and heat-bath Gibbs (v0.3, Apple Silicon)"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/quip-miner-metal"

[lib]
name = "quip_miner_metal"
path = "src/lib.rs"

[[bin]]
name = "quip-metal-sa"
path = "src/bin/quip_metal_sa.rs"

[[bin]]
name = "quip-metal-gibbs"
path = "src/bin/quip_metal_gibbs.rs"

# Shared protocol crates live in the quip-protocol repo; pinned by tag until
# they are published to a registry (crates.io / GitLab). Bump the tag to adopt
# newer shared code.
[dependencies]
quip-proto = { git = "https://gitlab.com/quip.network/quip-protocol.git", tag = "shared-v0.3.0" }
quip-protocol = { git = "https://gitlab.com/quip.network/quip-protocol.git", tag = "shared-v0.3.0" }
quip-miner-core = { git = "https://gitlab.com/quip.network/quip-protocol.git", tag = "shared-v0.3.0" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }

# Metal + IOKit are macOS-only; keep Linux CI green by gating the dependency.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
io-kit-sys = "0.5"
core-foundation-sys = "0.8"
# Streaming: internal completion-signal channel (host owner thread) + the
# Objective-C block passed to `MTLCommandBuffer.addCompletedHandler`.
crossbeam-channel = "0.5.16"
block = "0.1"
# Config parsing for apply_config (utilization/yielding schema).
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Parallel host scoring of a batch's samples; objc for the GPUStartTime/EndTime
# command-buffer timestamps (no accessor in metal-rs 0.33).
rayon = "1.10"
objc = "0.2"

[dev-dependencies]
quip-mock-coordinator = { git = "https://gitlab.com/quip.network/quip-protocol.git", tag = "shared-v0.3.0" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync", "process"] }
