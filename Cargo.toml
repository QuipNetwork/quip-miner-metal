[package]
name = "quip-miner-metal"
version = "0.3.0"
edition = "2021"
# MSRV contract for consumers. `rust-toolchain.toml` pins the *build* toolchain
# (1.97.1); this is the oldest compiler the crate is supported on.
rust-version = "1.97"
description = "Metal Ising miners: simulated annealing and heat-bath Gibbs (v0.3, Apple Silicon)"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/quip-miner-metal"

[lib]
name = "quip_miner_metal"
path = "src/lib.rs"

[[bin]]
name = "quip-metal-sa"
path = "src/bin/quip_metal_sa.rs"

[[bin]]
name = "quip-metal-gibbs"
path = "src/bin/quip_metal_gibbs.rs"

# Shared protocol crates live in the quip-protocol repo; tracked on its v0.3
# branch until they are published to a registry (crates.io / GitLab). The other
# miner repositories track the same branch, so all backends resolve one core.
[dependencies]
quip-proto = { git = "https://gitlab.com/quip.network/quip-protocol.git", branch = "v0.3" }
quip-protocol = { git = "https://gitlab.com/quip.network/quip-protocol.git", branch = "v0.3" }
quip-miner-core = { git = "https://gitlab.com/quip.network/quip-protocol.git", branch = "v0.3" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
# Diagnostics.
tracing = "0.1"
# Metal + IOKit. Ungated: this crate is macOS-only (see the `compile_error!`
# guard in `src/lib.rs`), so there is no target for a gate to select.
metal = "0.33"
io-kit-sys = "0.5"
core-foundation-sys = "0.8"
# Config parsing for apply_config (utilization/yielding schema).
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Parallel host scoring of a batch's samples; objc for the GPUStartTime/EndTime
# command-buffer timestamps (no accessor in metal-rs 0.33).
rayon = "1.10"
objc = "0.2"

[dev-dependencies]
quip-mock-coordinator = { git = "https://gitlab.com/quip.network/quip-protocol.git", branch = "v0.3" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync", "process"] }
# Property tests over the host-side encoders/scorers (`tests/properties.rs`).
proptest = "1.11"

# CI runs `cargo clippy -D warnings`, so every lint listed at `warn` here is
# effectively `deny`. Only lints this crate is measured clean against are
# enabled; the measured-but-failing ones are recorded as `allow` with their
# site count so the debt is visible rather than silently off.
#
# `[lints]` applies to every target in the package, including `tests/`. Lints
# that tests legitimately violate (`unwrap_used`, `expect_used`, `panic`)
# cannot be expressed here without breaking `--all-targets`; they are set as
# crate-root attributes in `src/lib.rs`, which scopes them to the library.
[lints.rust]
# The Metal, IOKit and objc FFI boundaries are the crate's reason to exist, so
# a blanket ban is impossible; `warn` would equal `deny` under `-D warnings`.
# Individual blocks carry `// SAFETY:` comments, enforced by
# `clippy::undocumented_unsafe_blocks` below.
unsafe_code = "allow"
unreachable_pub = "warn"

[lints.clippy]
# --- correctness / panic discipline (measured: 0 sites) ---
panic_in_result_fn = "deny"
unimplemented = "deny"
todo = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# `assert!(r.is_ok())` / `assert!(r.is_err())` without inspecting the payload
# is weaker than asserting the Ok value or Err kind. Prior pass fixed 5 sites;
# measured clean under `-W clippy::assertions_on_result_states`.
assertions_on_result_states = "warn"

# --- diagnostics must go through `tracing`, not the console (measured: 0
# `print_stdout`; the 3 `print_stderr` sites in `streaming.rs` are converted
# in this same change) ---
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "warn"

# --- style (measured: 0 sites) ---
redundant_clone = "warn"
uninlined_format_args = "warn"
manual_string_new = "warn"
use_self = "warn"

# --- unsafe hygiene: the counterpart to `unsafe_code = "allow"` above ---
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny"

# --- deliberately off ---
module_name_repetitions = "allow"
similar_names = "allow"
# TODO: 25 sites (`cargo clippy --lib --all-features -- -W
# clippy::indexing_slicing`); almost all in `topology.rs` (18), remainder in
# `sampler.rs`/`streaming.rs` hot loops indexing CSR buffers with
# host-computed offsets. Each needs individual review to decide `get()` vs.
# a documented invariant; turning this on now would break CI. Track
# separately before enabling.
indexing_slicing = "allow"
# NOT enabled: `pedantic` produces 162 warnings under
# `cargo clippy --all-targets --all-features -- -W clippy::pedantic`
# (91 of them cast-related —
# `cast_possible_truncation`/`cast_sign_loss`/`cast_possible_wrap` — which are
# deliberate for GPU buffer packing, plus 21 `doc_markdown` and 17
# `must_use_candidate`). Adopting it needs its own triage pass.
