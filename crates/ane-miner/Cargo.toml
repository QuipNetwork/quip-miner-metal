[workspace]
members = ["."]
resolver = "2"

[workspace.dependencies]
quip-solver-core = "=0.0.1"
quip-solver-conformance = "=0.0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tempfile = "3.27.0"
cc = "1.4.6"
tonic = "=0.12.3"
tokio-stream = { version = "=0.1.19", features = ["net"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"

[package]
name = "quip-miner-ane"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
description = "Standalone ANE MSA Ising miner"

[dependencies]
quip-solver-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tempfile.workspace = true

[dev-dependencies]
quip-solver-conformance.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
tokio = { workspace = true, features = ["net", "process"] }

[build-dependencies]
cc.workspace = true

[lints]
workspace = true

[[bin]]
name = "quip-ane-msa"
path = "src/bin/quip_ane_msa.rs"
