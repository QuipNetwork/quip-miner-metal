# Package prose exceptions. Do not put Vale directives in the Markdown files.
#
# README.md keeps the binary name as the H1. Sentence-case heading rules would
# rename `quip-ane-msa`. The binary name, JSON keys, and protocol tokens also
# hold the Flesch score just below 70.
# docs/validation.md must keep SHAs, cargo lines, and exact counts. Those tokens
# hold the Flesch score below 70 and the Coleman-Liau grade just above 9.

[README.md]
Google.Headings = NO
Microsoft.Headings = NO
Readability.FleschReadingEase = NO

[docs/validation.md]
Readability.FleschReadingEase = NO
Readability.ColemanLiau = NO
