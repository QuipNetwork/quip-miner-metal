[package]
name = "quip-testnet-regen"
version = "0.0.0"
edition = "2021"
publish = false
description = "Regenerate each fetched qblock's Ising problem from its nonce"

# Standalone, like crates/ane-miner: the root package is not a workspace.
[workspace]

[dependencies]
quip-protocol = "=0.0.1"
blake2 = "0.10.6"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
